# Cloudflare Workers config (static-assets deploy — the current recommended model).
#
# The Worker entry in `worker/index.ts` routes the three dynamic paths (/api/stats, /og,
# /share) to the handlers under `functions/`, and falls through to the static SPA bundle in
# `dist/` via the `ASSETS` binding. `not_found_handling = "single-page-application"` serves
# index.html for unknown client-router paths.
#
# Deploy with:  npx wrangler deploy   (build first: npm run build)
#
# The D1 binding is optional at runtime: the stats route returns 503 when `STATS_DB` is absent
# and the client treats any failure as "no community data", so the game still works 100%
# static if the database is unconfigured or down.

name = "commandle"
main = "worker/index.ts"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Create once with:  npx wrangler d1 create commandle-stats
# then paste the printed database_id below (and mirror this binding in the Workers dashboard →
# Settings → Bindings → D1 for the production deploy).
[[d1_databases]]
binding = "STATS_DB"
database_name = "commandle-stats"
database_id = "ac4ef84f-8b4a-40c2-8cc9-e4a2feb2471a"
