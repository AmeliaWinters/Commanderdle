<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0d" />
    <!-- Paint the app's dark background from the very first frame so there's no white
         flash before the stylesheet/JS load. Must be set on BODY, not HTML: the animated
         orbs (body::before) and card backdrop sit at negative z-index and rely on the
         body background propagating to the canvas. An html background would break that
         propagation and paint the body's own background over them, hiding both. -->
    <style>
      body {
        background: #0b0b0d;
      }
    </style>
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Commandle — Daily MTG Commander Guessing Game</title>
    <meta name="description" content="Guess the daily Magic: The Gathering commander from the top 500. Five modes: Classic, Silhouette, Zoom, Synergy, and Quote — a fresh puzzle every day." />
    <link rel="canonical" href="https://commandle.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Commandle" />
    <meta property="og:title" content="Commandle — Daily MTG Commander Guessing Game" />
    <meta property="og:description" content="Guess the daily Magic: The Gathering commander. Five modes, a fresh puzzle every day." />
    <meta property="og:url" content="https://commandle.com/" />
    <meta property="og:image" content="https://commandle.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Commandle — a daily Magic: The Gathering commander guessing game" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Commandle — Daily MTG Commander Guessing Game" />
    <meta name="twitter:description" content="Guess the daily Magic: The Gathering commander. Five modes, a fresh puzzle every day." />
    <meta name="twitter:image" content="https://commandle.com/og-image.png" />

    <!-- Self-hosted fonts (see @font-face in base.css). Preload the two faces used in
         the first paint so text swaps to the real font as early as possible. -->
    <link
      rel="preload"
      href="/fonts/cinzel-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/ebgaramond-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- AdSense and analytics are loaded at runtime from Vite env vars (see AdBanner.tsx / analytics.ts). -->

    <!-- Structured data: helps search engines classify the site as a free browser game. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Commandle",
        "url": "https://commandle.com/",
        "description": "A daily Magic: The Gathering commander guessing game with five modes — Classic, Silhouette, Zoom, Synergy, and Quote — plus an endless Higher / Lower side game. Everyone gets the same puzzle each day.",
        "applicationCategory": "GameApplication",
        "genre": "Puzzle game",
        "operatingSystem": "Any (web browser)",
        "browserRequirements": "Requires JavaScript",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Crawler-visible fallback. React replaces this on mount; search engines and
           no-JS clients index the real copy below instead of an empty shell. -->
      <noscript>
        <h1>Commandle — Daily MTG Commander Guessing Game</h1>
        <p>
          Commandle is a free daily <strong>Magic: The Gathering</strong> commander
          guessing game. Every day everyone gets the same puzzle: deduce the day's
          commander, then share a spoiler-free result grid.
        </p>
        <h2>Game modes</h2>
        <ul>
          <li><a href="/">Classic</a> — deduce the commander from colour, type, and stat clues.</li>
          <li><a href="/silhouette">Silhouette</a> — name it from the card-art outline.</li>
          <li><a href="/zoom">Zoom</a> — identify it from a crop that widens with each guess.</li>
          <li><a href="/synergy">Synergy</a> — guess it from the cards it synergizes with most.</li>
          <li><a href="/quote">Quote</a> — place it from its flavor text.</li>
          <li><a href="/higher-lower">Higher / Lower</a> — an endless bonus round.</li>
        </ul>
        <p>JavaScript is required to play. Please enable it and reload.</p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
