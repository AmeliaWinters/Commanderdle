<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- AdSense is NOT loaded here. The loader is injected at runtime by AdBanner.tsx,
         and only after (a) VITE_ADSENSE_PUB_ID / VITE_ADSENSE_SLOT_ID are configured and
         (b) the visitor has granted consent via the cookie banner. Hardcoding the tag here
         would load it for everyone before consent — a GDPR problem and dead weight when ads
         aren't configured. -->
    <meta name="theme-color" content="#0b0b0d" />
    <!-- Paint the app's dark background from the very first frame so there's no white
         flash before the stylesheet/JS load. Must be set on BODY, not HTML: the animated
         orbs (body::before) and card backdrop sit at negative z-index and rely on the
         body background propagating to the canvas. An html background would break that
         propagation and paint the body's own background over them, hiding both. -->
    <style>
      body {
        background: #0b0b0d;
      }

      /* ------------------------------------------------------------------ *
       * Inline app-shell skeleton.
       *
       * The app is a client-rendered SPA: without this, #root stays empty
       * until ~110KB (gzip) of React + app JS downloads, parses and executes,
       * so on a mid-tier phone the first meaningful paint (and LCP) lands
       * around 5-6s. This static shell arrives with the HTML and paints as
       * soon as the (small, ~9KB gzip) stylesheet is in — giving a real
       * contentful paint (the <h1>) seconds before the JS is ready. React's
       * createRoot().render() clears #root on mount, swapping the skeleton
       * for the live app. The <h1> here is byte-for-byte the same element the
       * app renders, so the title never moves (no layout shift, stable LCP).
       *
       * Everything is scoped under #boot so it can't leak into the loaded
       * stylesheet, and it's aria-hidden so it's invisible to assistive tech.
       * ------------------------------------------------------------------ */
      /* ------------------------------------------------------------------ *
       * Loading state.
       *
       * A bare flame-coloured ring centred over the page background (the
       * floating backdrop card in #boot-backdrop still paints from the HTML,
       * so the loader sits on the same scene the app loads into). No title or
       * chrome — React clears #boot on mount and renders the real app.
       * ------------------------------------------------------------------ */
      #boot {
        --line: #2c2c34;
        --flame-1: #f6a01a;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
      }
      /* Static copy of the app's drifting flame glows (body::before in base.css)
         so the loader sits on the same background the app loads into. Painted
         from the HTML; no animation — it just needs to be there. */
      #boot-orbs {
        position: fixed;
        inset: -20%;
        z-index: -3;
        pointer-events: none;
        opacity: 0.9;
        filter: blur(60px);
        background:
          radial-gradient(
            42% 42% at 25% 30%,
            rgba(236, 90, 28, 0.5),
            transparent 70%
          ),
          radial-gradient(
            46% 46% at 78% 70%,
            rgba(192, 31, 31, 0.45),
            transparent 70%
          ),
          radial-gradient(
            38% 38% at 60% 15%,
            rgba(246, 160, 26, 0.32),
            transparent 70%
          );
      }
      #boot .boot-spinner {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          transparent 0deg,
          var(--flame-1) 300deg,
          transparent 360deg
        );
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 5px),
          #000 calc(100% - 5px)
        );
        mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 5px),
          #000 calc(100% - 5px)
        );
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Commandle MTG Commander Guessing Game</title>
    <meta
      name="description"
      content="Guess the daily Magic: The Gathering commander from the top 500 EDH Rank. Five modes: Classic, Silhouette, Zoom, Synergy, and Quote. 5 fresh puzzles every day."
    />
    <link rel="canonical" href="https://commandle.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Commandle" />
    <meta property="og:title" content="Commandle MTG Commander Guessing Game" />
    <meta
      property="og:description"
      content="Guess the daily Magic: The Gathering commander. Five modes, a fresh puzzle every day."
    />
    <meta property="og:url" content="https://commandle.app/" />
    <meta property="og:image" content="https://commandle.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Commandle a daily Magic: The Gathering commander guessing game"
    />

    <!-- Self-hosted fonts (see @font-face in base.css). Preload the two faces used in
         the first paint so text swaps to the real font as early as possible. -->
    <link
      rel="preload"
      href="/fonts/cinzel-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/ebgaramond-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- AdSense and analytics are loaded at runtime from Vite env vars (see AdBanner.tsx / analytics.ts). -->

    <!-- Structured data: helps search engines classify the site as a free browser game. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Commandle",
        "url": "https://commandle.app/",
        "description": "A daily Magic: The Gathering commander guessing game with five modes: Classic, Silhouette, Zoom, Synergy, and Quote, plus Higher / Lower and Guess the cost side games. Everyone gets the same puzzle each day.",
        "applicationCategory": "GameApplication",
        "genre": "Puzzle game",
        "operatingSystem": "Any (web browser)",
        "browserRequirements": "Requires JavaScript",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Loading state (styles in <head>): the app's ambient orbs plus a
           spinner, painted with the HTML so there's something on screen before
           the JS bundle is ready. React clears it on mount. -->
      <div id="boot" aria-hidden="true">
        <div id="boot-orbs" aria-hidden="true"></div>
        <div class="boot-spinner"></div>
      </div>
      <!-- Crawler-visible fallback. React replaces this on mount; search engines and
           no-JS clients index the real copy below instead of an empty shell. -->
      <noscript>
        <h1>Commandle MTG Commander Guessing Game</h1>
        <p>
          Commandle is a free daily
          <strong>Magic: The Gathering</strong> commander guessing game. Every
          day everyone gets the same puzzle. Deduce the day's commander, then
          share a spoiler-free result grid.
        </p>
        <h2>Game modes</h2>
        <ul>
          <li>
            <a href="/classic">Classic</a> - deduce the commander from colour,
            type, and stat clues.
          </li>
          <li>
            <a href="/silhouette">Silhouette</a> - name it from the card-art
            outline.
          </li>
          <li>
            <a href="/zoom">Zoom</a> - identify it from a crop that widens with
            each guess.
          </li>
          <li>
            <a href="/synergy">Synergy</a> - guess it from the cards it
            synergizes with most.
          </li>
          <li><a href="/quote">Quote</a> - place it from its flavor text.</li>
          <li>
            <a href="/higher-lower">Higher / Lower</a> - an endless bonus round.
          </li>
          <li>
            <a href="/guess-the-cost">Guess the cost</a> - guess the card's
            market price.
          </li>
        </ul>
        <p>JavaScript is required to play. Please enable it and reload.</p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
