<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b0d" />
    <style>
      body {
        background: #0b0b0d;
      }
      html[data-theme="light"] body {
        background: #f4eee1;
      }
      html[data-theme="light"] #boot-orbs {
        opacity: 0.35;
      }
      #boot {
        --line: #2c2c34;
        --flame-1: #f6a01a;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
      }
      #boot-orbs {
        position: fixed;
        inset: -20%;
        z-index: -3;
        pointer-events: none;
        opacity: 0.55;
        filter: blur(70px);
        background:
          radial-gradient(
            38% 38% at 25% 30%,
            rgba(236, 90, 28, 0.34),
            transparent 70%
          ),
          radial-gradient(
            40% 40% at 78% 70%,
            rgba(192, 31, 31, 0.3),
            transparent 70%
          ),
          radial-gradient(
            32% 32% at 60% 15%,
            rgba(246, 160, 26, 0.2),
            transparent 70%
          );
      }
      #boot .boot-spinner {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          transparent 0deg,
          var(--flame-1) 300deg,
          transparent 360deg
        );
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 5px),
          #000 calc(100% - 5px)
        );
        mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 5px),
          #000 calc(100% - 5px)
        );
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("commandle:theme");
          var theme =
            pref === "light" || pref === "dark"
              ? pref
              : matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta && theme === "light") meta.content = "#f4eee1";
        } catch (e) {
          /* default dark */
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Commandle - MTG Commander Guessing Game</title>
    <meta
      name="description"
      content="Commandle is a free daily Magic: The Gathering commander (EDH) dle game. Guess the day's commander from colour, type, and stat clues in Classic, name it from blurred art (Silhouette), a zooming crop (Zoom), its synergy cards (Synergy), or flavour text (Quote) - plus Higher / Lower, Guess the Cost, and Grid bonus rounds. Everyone gets the same puzzle each day. Card data from Scryfall and EDHREC. Unofficial fan project."
    />
    <meta name="author" content="ame@commandle.app" />
    <link rel="canonical" href="https://commandle.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Commandle" />
    <meta
      property="og:title"
      content="Commandle - MTG Commander Guessing Game"
    />
    <meta
      name="description"
      content="Commandle is a free daily Magic: The Gathering commander (EDH) dle game. Guess the day's commander from colour, type, and stat clues in Classic, name it from blurred art (Silhouette), a zooming crop (Zoom), its synergy cards (Synergy), or flavour text (Quote) - plus Higher / Lower, Guess the Cost, and Grid bonus rounds. Everyone gets the same puzzle each day. Card data from Scryfall and EDHREC. Unofficial fan project."
    />
    <meta property="og:url" content="https://commandle.app/" />
    <meta property="og:image" content="https://commandle.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Commandle - MTG Commander Guessing Game"
    />

    <link
      rel="preload"
      href="/fonts/cinzel-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/ebgaramond-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Commandle",
        "alternateName": "Commander Guessing Game",
        "url": "https://commandle.app/",
        "description": "Commandle is a free daily Magic: The Gathering commander (EDH) dle game. Guess the day's commander from colour, type, and stat clues in Classic, name it from blurred art (Silhouette), a zooming crop (Zoom), its synergy cards (Synergy), or flavour text (Quote) - plus Higher / Lower, Guess the Cost, and Grid bonus rounds. Everyone gets the same puzzle each day. Card data from Scryfall and EDHREC. Unofficial fan project.",
        "applicationCategory": "GameApplication",
        "genre": "Puzzle game",
        "operatingSystem": "Any (web browser)",
        "browserRequirements": "Requires JavaScript",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "author": {
          "@type": "Organization",
          "name": "Commandle",
          "description": "A Magic The Gathering fan project, not affiliated with Wizards of the Coast.",
          "url": "https://commandle.app/about"
        },
        "creator": {
          "@type": "Organization",
          "name": "Commandle",
          "url": "https://commandle.app/about"
        },
        "featureList": [
          "Classic - guess the commander from colour, type and stat clues",
          "Silhouette - guess the commander  from blurred card art",
          "Zoom - guess the commander  from a crop that widens each guess",
          "Synergy - guess the commander  from its top synergy cards",
          "Quote - guess the commander  from its flavour text",
          "Higher / Lower - which commander has more decls",
          "Guess the Cost - guess the commander's market price",
          "Grid - find the commander that fits both criteria"
        ],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root">

      <div id="boot" aria-hidden="true">
        <div id="boot-orbs" aria-hidden="true"></div>
        <div class="boot-spinner"></div>
      </div>

      <noscript>
        <h1>Commandle MTG Commander Guessing Game</h1>
        <p>
          Commandle is a free daily
          <strong>Magic The Gathering</strong> commander guessing game. Every
          day everyone gets the same puzzle. Deduce the day's commander, then
          share a spoiler-free result grid.
        </p>
        <h2>Game modes</h2>
        <ul>
          <li>
            <a href="/classic">Classic</a> - deduce the commander from colour,
            type, and stat clues.
          </li>
          <li>
            <a href="/silhouette">Silhouette</a> - name it from the card-art
            outline.
          </li>
          <li>
            <a href="/zoom">Zoom</a> - identify it from a crop that widens with
            each guess.
          </li>
          <li>
            <a href="/synergy">Synergy</a> - guess it from the cards it
            synergizes with most.
          </li>
          <li><a href="/quote">Quote</a> - place it from its flavor text.</li>
          <li>
            <a href="/higher-lower">Higher / Lower</a> - an endless bonus round.
          </li>
          <li>
            <a href="/guess-the-cost">Guess the cost</a> - guess the card's
            market price.
          </li>
        </ul>
        <p>JavaScript is required to play. Please enable it and reload.</p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
